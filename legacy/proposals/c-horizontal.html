<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>C. Horizontal scroll</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Six+Caps&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
.h { height: 100vh; overflow: hidden; position: relative; display: flex; flex-direction: column; justify-content: center; }
.head { display: flex; justify-content: space-between; align-items: end; padding: 0 var(--g) 28px; }
.head h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(3rem, 6vw, 6rem); line-height: .9; text-transform: uppercase; }
.count { font-family: var(--display); font-size: clamp(2.5rem, 4vw, 4rem); color: var(--muted); }
.count b { color: var(--fg); font-weight: 400; }
.track { display: flex; gap: 28px; padding: 0 var(--g); width: max-content; will-change: transform; }
.slide { position: relative; width: min(62vw, 980px); height: 62vh; border-radius: 14px; overflow: hidden; flex: none; }
.slide img { position: absolute; inset: 0; height: 100%; object-fit: cover; object-position: top; transform: scale(1.12); }
.slide::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, rgba(0,0,0,.85)); }
.slide .info { position: absolute; z-index: 2; left: 30px; right: 30px; bottom: 26px; display: flex; justify-content: space-between; align-items: end; gap: 20px; }
.slide h3 { margin: 10px 0 0; font-family: var(--display); font-weight: 400; font-size: clamp(3.5rem, 6vw, 6.5rem); line-height: .85; text-transform: uppercase; }
.slide .m { margin: 6px 0 0; color: #ddd; }
.bar2 { position: absolute; left: var(--g); right: var(--g); bottom: 6vh; height: 2px; background: var(--line); }
.bar2 i { display: block; height: 100%; width: 0; background: #fff; }
@media (max-width: 860px) { .h { height: auto; padding: 10vh 0; } .track { overflow-x: auto; width: auto; scroll-snap-type: x mandatory; } .slide { width: 85vw; height: 60vh; scroll-snap-align: center; } .bar2 { display: none; } }
</style></head>
<body>
<div class="bar"><b>EJ</b><span>About &nbsp; Portfolio &nbsp; Contact</span></div>
<section class="intro"><div><h1>Esse Jacques</h1><p>Option C: horizontal scroll</p></div></section>
<section class="h" id="h">
  <div class="head"><h2>Selected work</h2><span class="count"><b id="n">01</b> / 08</span></div>
  <div class="track" id="track"></div>
  <div class="bar2"><i id="p"></i></div>
</section>
<div class="more"><a href="#">See all works</a></div>
<span class="tag">C. Défilement horizontal</span>
<script src="data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
const track = document.getElementById("track");
track.innerHTML = PROJECTS.map(p => `
  <a class="slide" href="#"><img src="${p.img}" alt="">
    <div class="info"><div><span class="label">${p.kind} &nbsp; ${p.year}</span><h3>${p.title}</h3><p class="m">${p.metric}</p></div><span class="label">${p.stack}</span></div></a>`).join("");
gsap.registerPlugin(ScrollTrigger);
const mm = gsap.matchMedia();
mm.add("(min-width: 861px)", () => {
  const dist = () => track.scrollWidth - innerWidth;
  const tween = gsap.to(track, { x: () => -dist(), ease: "none",
    scrollTrigger: { trigger: "#h", pin: true, scrub: 1, end: () => "+=" + dist(), invalidateOnRefresh: true,
      onUpdate: s => {
        document.getElementById("p").style.width = (s.progress * 100) + "%";
        document.getElementById("n").textContent = String(Math.min(PROJECTS.length, Math.floor(s.progress * PROJECTS.length) + 1)).padStart(2, "0");
      } } });
  gsap.utils.toArray(".slide img").forEach(img => gsap.to(img, { xPercent: -8, ease: "none",
    scrollTrigger: { trigger: img.parentElement, containerAnimation: tween, start: "left right", end: "right left", scrub: true } }));
});
</script>
</body></html>
